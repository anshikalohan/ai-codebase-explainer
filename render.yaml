services:
  - type: web
    name: ai-codebase-explainer-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: '["https://your-frontend.vercel.app"]'
      - key: PYTHON_VERSION
        value: "3.11.0"
    disk:
      name: vector-store
      mountPath: /opt/render/project/src/data/vector_store
      sizeGB: 1
